[package]
name = "ygopro-yrp-decoding"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["jwyxym <jwyxym@126.com>"]
description = "将yrp解析为yrp3d字节流"
keywords = ["ygopro"]
repository = "https://github.com/jwyxym/ygopro-yrp-decoding"

[dependencies]
ygopro = { version = "0.1.7", default-features = false, features = ["koishi", "forge"] }
ygopro-data = { version = "0.1.3", default-features = false }
ygopro-core-wrapper = { version = "0.1.3", default-features = false, features = ["koishi"] }
ygopro-handler = "0.1.3"
tokio = "1"
tokio-stream = "0"
futures = "0"
parking_lot = "0.12"
binrw = "0"
anyhow = "1"
lzma-rs = "0"